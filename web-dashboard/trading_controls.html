<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiTradingAgent - Trading Controls</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .status-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid #00d4ff;
        }

        .status-item label {
            font-size: 0.9em;
            color: #999;
            display: block;
            margin-bottom: 5px;
        }

        .status-item value {
            font-size: 1.5em;
            font-weight: bold;
            display: block;
        }

        .main-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .control-panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }

        .control-panel h2 {
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #00d4ff;
            padding-bottom: 10px;
        }

        .button-group {
            display: grid;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 24px;
            font-size: 1em;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #00d4ff, #0099ff);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 212, 255, 0.3);
        }

        .btn-buy {
            background: linear-gradient(45deg, #00ff88, #00cc66);
            color: white;
        }

        .btn-buy:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 255, 136, 0.3);
        }

        .btn-sell {
            background: linear-gradient(45deg, #ff4444, #cc0000);
            color: white;
        }

        .btn-sell:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 68, 68, 0.3);
        }

        .btn-danger {
            background: linear-gradient(45deg, #ff6b6b, #cc0000);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.3);
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .mode-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: #00d4ff;
            border-color: #00d4ff;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: #999;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: white;
            font-size: 1em;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .trade-section {
            background: rgba(255, 255, 255, 0.02);
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .confirmation-box {
            background: rgba(255, 200, 0, 0.1);
            border: 1px solid rgba(255, 200, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
        }

        .confirmation-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 3px solid #ffcc00;
        }

        .confirmation-item button {
            margin-right: 10px;
            margin-top: 10px;
        }

        .trade-history {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .trade-item {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 15px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 3px solid #00d4ff;
        }

        .trade-item.buy {
            border-left-color: #00ff88;
        }

        .trade-item.sell {
            border-left-color: #ff4444;
        }

        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        .indicator.active {
            background: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .indicator.inactive {
            background: #666;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .main-controls {
                grid-template-columns: 1fr;
            }

            .grid-2 {
                grid-template-columns: 1fr;
            }

            .status-bar {
                grid-template-columns: 1fr 1fr;
            }
        }

        .alert {
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: #00ff88;
        }

        .alert-error {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            color: #ff4444;
        }

        .alert-warning {
            background: rgba(255, 200, 0, 0.1);
            border: 1px solid rgba(255, 200, 0, 0.3);
            color: #ffcc00;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 AiTradingAgent - Trading Controls</h1>
            <div class="status-bar">
                <div class="status-item">
                    <label>Status</label>
                    <value><span class="indicator active"></span>LIVE</value>
                </div>
                <div class="status-item">
                    <label>Mode</label>
                    <value id="mode-display">MANUAL</value>
                </div>
                <div class="status-item">
                    <label>Trading</label>
                    <value id="trading-status">INACTIVE</value>
                </div>
                <div class="status-item">
                    <label>Total Trades</label>
                    <value id="total-trades">0</value>
                </div>
            </div>
        </header>

        <div class="alert alert-warning" id="paper-trading-alert">
            ⚠️ PAPER TRADING MODE - No real money at risk
        </div>

        <div class="alert" id="alert-box"></div>

        <div class="main-controls">
            <!-- Trading Mode Control -->
            <div class="control-panel">
                <h2>🎮 Trading Mode</h2>
                <div class="mode-selector">
                    <button class="mode-btn active" onclick="setMode('automation')">🤖 Automation</button>
                    <button class="mode-btn" onclick="setMode('manual')">👆 Manual</button>
                    <button class="mode-btn" onclick="setMode('hybrid')">🔄 Hybrid</button>
                </div>
                <div class="button-group">
                    <button class="btn-primary" onclick="startTrading()">▶️ START TRADING</button>
                    <button class="btn-danger" onclick="stopTrading()">⏹️ STOP TRADING</button>
                </div>
            </div>

            <!-- Manual Trading -->
            <div class="control-panel">
                <h2>💱 Manual Trading</h2>
                <div class="trade-section">
                    <div class="input-group">
                        <label>Symbol</label>
                        <input type="text" id="trade-symbol" placeholder="BTC/USDT" value="BTC/USDT">
                    </div>
                    <div class="grid-2">
                        <div class="input-group">
                            <label>Amount</label>
                            <input type="number" id="trade-amount" placeholder="0.01" value="0.01" step="0.001">
                        </div>
                        <div class="input-group">
                            <label>Price (optional)</label>
                            <input type="number" id="trade-price" placeholder="Market" step="0.01">
                        </div>
                    </div>
                    <div class="button-group">
                        <button class="btn-buy" onclick="quickBuy()">💚 QUICK BUY</button>
                        <button class="btn-sell" onclick="quickSell()">💔 QUICK SELL</button>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="control-panel">
                <h2>⚡ Quick Actions</h2>
                <div class="button-group">
                    <button class="btn-buy btn-small" onclick="quickAction('buy', 0.01)">Buy 0.01 BTC</button>
                    <button class="btn-buy btn-small" onclick="quickAction('buy', 0.05)">Buy 0.05 BTC</button>
                    <button class="btn-buy btn-small" onclick="quickAction('buy', 0.1)">Buy 0.1 BTC</button>
                </div>
                <div class="button-group">
                    <button class="btn-sell btn-small" onclick="quickAction('sell', 0.01)">Sell 0.01 BTC</button>
                    <button class="btn-sell btn-small" onclick="quickAction('sell', 0.05)">Sell 0.05 BTC</button>
                    <button class="btn-sell btn-small" onclick="quickAction('sell', 0.1)">Sell 0.1 BTC</button>
                </div>
            </div>
        </div>

        <!-- Pending Confirmations -->
        <div class="control-panel" style="display: none;" id="confirmations-panel">
            <h2>⏳ Pending Confirmations (<span id="confirmation-count">0</span>)</h2>
            <div class="confirmation-box" id="confirmations-list">
                <p style="color: #999; text-align: center;">No pending trades</p>
            </div>
        </div>

        <!-- Trade History -->
        <div class="control-panel">
            <h2>📋 Recent Trades</h2>
            <button class="btn-primary btn-small" onclick="refreshTrades()">🔄 Refresh</button>
            <div class="trade-history" id="trades-list">
                <p style="color: #999; text-align: center;">No trades yet</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://localhost:3003/api";

        // Status update
        async function updateStatus() {
            try {
                const response = await fetch(`${API_BASE}/status`);
                const data = await response.json();

                document.getElementById("mode-display").textContent = data.mode.toUpperCase();
                document.getElementById("trading-status").textContent = data.is_active ? "ACTIVE" : "INACTIVE";
                document.getElementById("total-trades").textContent = data.total_trades;

                // Update mode buttons
                document.querySelectorAll(".mode-btn").forEach(btn => {
                    btn.classList.remove("active");
                });
                document.querySelector(`[onclick="setMode('${data.mode}')"]`)?.classList.add("active");
            } catch (error) {
                console.error("Error updating status:", error);
            }
        }

        // Set trading mode
        async function setMode(mode) {
            try {
                const response = await fetch(`${API_BASE}/mode/set`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ mode })
                });
                const data = await response.json();
                showAlert(`Mode changed to ${mode}`, "success");
                updateStatus();
            } catch (error) {
                showAlert(`Error: ${error.message}`, "error");
            }
        }

        // Start trading
        async function startTrading() {
            try {
                const response = await fetch(`${API_BASE}/trading/start`, { method: "POST" });
                const data = await response.json();
                showAlert("Trading started!", "success");
                updateStatus();
            } catch (error) {
                showAlert(`Error: ${error.message}`, "error");
            }
        }

        // Stop trading
        async function stopTrading() {
            if (!confirm("Are you sure you want to stop trading?")) return;
            try {
                const response = await fetch(`${API_BASE}/trading/stop`, { method: "POST" });
                const data = await response.json();
                showAlert("Trading stopped!", "warning");
                updateStatus();
            } catch (error) {
                showAlert(`Error: ${error.message}`, "error");
            }
        }

        // Quick buy
        async function quickBuy() {
            const symbol = document.getElementById("trade-symbol").value;
            const amount = parseFloat(document.getElementById("trade-amount").value);
            const price = document.getElementById("trade-price").value ? parseFloat(document.getElementById("trade-price").value) : null;

            try {
                const response = await fetch(`${API_BASE}/trade/buy`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ symbol, amount, price })
                });
                const data = await response.json();

                if (data.status === "executed" || data.status === "pending_confirmation") {
                    showAlert(`${amount} ${symbol} ${data.status === "executed" ? "purchased" : "pending confirmation"}!`, "success");
                } else {
                    showAlert(`Error: ${data.reason || data.status}`, "error");
                }
                updateStatus();
                refreshTrades();
            } catch (error) {
                showAlert(`Error: ${error.message}`, "error");
            }
        }

        // Quick sell
        async function quickSell() {
            const symbol = document.getElementById("trade-symbol").value;
            const amount = parseFloat(document.getElementById("trade-amount").value);
            const price = document.getElementById("trade-price").value ? parseFloat(document.getElementById("trade-price").value) : null;

            try {
                const response = await fetch(`${API_BASE}/trade/sell`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ symbol, amount, price })
                });
                const data = await response.json();

                if (data.status === "executed" || data.status === "pending_confirmation") {
                    showAlert(`${amount} ${symbol} ${data.status === "executed" ? "sold" : "pending confirmation"}!`, "success");
                } else {
                    showAlert(`Error: ${data.reason || data.status}`, "error");
                }
                updateStatus();
                refreshTrades();
            } catch (error) {
                showAlert(`Error: ${error.message}`, "error");
            }
        }

        // Quick action
        async function quickAction(action, amount) {
            const symbol = "BTC/USDT";
            try {
                const endpoint = action === "buy" ? "/trade/buy" : "/trade/sell";
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ symbol, amount })
                });
                const data = await response.json();
                showAlert(`${action.toUpperCase()} ${amount} BTC!`, "success");
                updateStatus();
                refreshTrades();
            } catch (error) {
                showAlert(`Error: ${error.message}`, "error");
            }
        }

        // Refresh trades
        async function refreshTrades() {
            try {
                const response = await fetch(`${API_BASE}/trades?limit=10`);
                const data = await response.json();

                const list = document.getElementById("trades-list");
                if (data.trades.length === 0) {
                    list.innerHTML = "<p style='color: #999; text-align: center;'>No trades yet</p>";
                    return;
                }

                list.innerHTML = data.trades.reverse().map(trade => `
                    <div class="trade-item ${trade.action.toLowerCase()}">
                        <div>
                            <strong>${trade.action.toUpperCase()}</strong><br>
                            ${trade.symbol}
                        </div>
                        <div>
                            <strong>${trade.amount} @ $${trade.price.toFixed(2)}</strong><br>
                            <small>${new Date(trade.executed_at).toLocaleTimeString()}</small>
                        </div>
                        <div>
                            <strong>$${(trade.amount * trade.price).toFixed(2)}</strong><br>
                            <small>${trade.status}</small>
                        </div>
                    </div>
                `).join("");
            } catch (error) {
                console.error("Error refreshing trades:", error);
            }
        }

        // Show alert
        function showAlert(message, type) {
            const box = document.getElementById("alert-box");
            box.textContent = message;
            box.className = `alert show alert-${type}`;
            setTimeout(() => box.classList.remove("show"), 5000);
        }

        // Initialize
        updateStatus();
        refreshTrades();
        setInterval(updateStatus, 5000);
        setInterval(refreshTrades, 10000);
    </script>
</body>
</html>
