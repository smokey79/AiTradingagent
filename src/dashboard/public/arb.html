<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arbitrage module - paper P/L</title>
<style>
 body{font:14px system-ui,Segoe UI,Arial,sans-serif;margin:0;background:#0f1419;color:#d7dde4}
 header{padding:14px 20px;background:#151c24;border-bottom:1px solid #243040}
 h1{font-size:18px;margin:0 0 4px} .sub{color:#8fa1b3;font-size:12px}
 .banner{background:#3a2f12;color:#f0d28a;padding:8px 20px;font-size:12px;border-bottom:1px solid #5a4a1a}
 main{padding:16px 20px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
 section{background:#151c24;border:1px solid #243040;border-radius:8px;padding:12px 14px;overflow:auto}
 h2{font-size:13px;margin:0 0 8px;color:#9fb6cc;text-transform:uppercase;letter-spacing:.04em}
 .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi{background:#0f1419;border-radius:6px;padding:8px}
 .kpi b{display:block;font-size:18px}.kpi span{font-size:11px;color:#8fa1b3}
 table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:4px 6px;border-bottom:1px solid #1f2a37;text-align:right;white-space:nowrap}
 th:first-child,td:first-child,td.l,th.l{text-align:left}th{color:#8fa1b3;font-weight:600}
 .pos{color:#4cd68a}.neg{color:#ff6b6b} .muted{color:#8fa1b3} svg{width:100%;height:120px;background:#0f1419;border-radius:6px}
 .wide{grid-column:1/-1}
</style></head><body>
<header><h1>Arbitrage module &middot; paper profit &amp; loss</h1><div class="sub" id="upd">loading...</div></header>
<div class="banner" id="mode"></div>
<main>
 <section class="wide"><h2>Profit / loss (paper)</h2><div class="kpis" id="kpis"></div><svg id="curve" viewBox="0 0 600 120" preserveAspectRatio="none"></svg>
  <div class="muted" id="costs" style="margin-top:6px"></div></section>
 <section><h2>Paper trades</h2><table id="trades"></table></section>
 <section><h2>Predictor (scored against what really happened)</h2><div id="pstats" class="muted"></div><table id="calib"></table><table id="preds"></table></section>
 <section><h2>Latest spreads seen (after costs)</h2><table id="obs"></table></section>
 <section><h2>Routes by average net spread</h2><table id="routes"></table></section>
 <section class="wide"><h2>24 h history: how often cross-exchange gaps beat the cost (indicative: close vs close)</h2><table id="hist"></table></section>
</main>
<script>
const $=id=>document.getElementById(id), f=(x,d=3)=>x==null?'-':Number(x).toFixed(d), cls=x=>x>0?'pos':x<0?'neg':'';
const tbl=(el,head,rows)=>{$(el).innerHTML='<tr>'+head.map((h,i)=>`<th class="${i?'':'l'}">${h}</th>`).join('')+'</tr>'+rows.join('')||''};
async function j(u){const r=await fetch(u);return r.json()}
async function load(){
 const [s,t,o,p]=await Promise.all([j('/api/arb/summary'),j('/api/arb/trades?limit=40'),j('/api/arb/opportunities?limit=30'),j('/api/arb/predictions?limit=25')]);
 $('mode').textContent=s.mode; $('upd').textContent='updated '+new Date().toLocaleTimeString()+' - refreshes every 15 s';
 const m=s.pnl;
 $('kpis').innerHTML=[['Net P/L $',f(m.netUsd,2),m.netUsd],['Trades',m.trades],['Win rate',m.winRate==null?'-':(m.winRate*100).toFixed(1)+'%'],['Profit factor',m.profitFactor==null?'-':f(m.profitFactor,2)],
  ['Equity $',f(m.equity,2)],['Max drawdown $',f(m.maxDrawdownUsd,2)],['Avg net / trade $',f(m.avgNetUsd,3)],['Start capital $',f(m.startCapital,0)]]
  .map(k=>`<div class="kpi"><b class="${k[2]!=null?cls(k[2]):''}">${k[1]}</b><span>${k[0]}</span></div>`).join('');
 $('costs').textContent=`Of gross $${f(m.grossUsd,2)}: fees $${f(m.feesUsd,2)}, latency haircut $${f(m.latencyUsd,2)}, rebalancing $${f(m.rebalanceUsd,2)} -> net $${f(m.netUsd,2)}`;
 const c=m.curve; if(c.length>1){const lo=Math.min(...c.map(x=>x.equity)),hi=Math.max(...c.map(x=>x.equity)),sp=(hi-lo)||1;
  $('curve').innerHTML='<polyline fill="none" stroke="#4cd68a" stroke-width="2" points="'+c.map((x,i)=>(i/(c.length-1)*600).toFixed(1)+','+(115-(x.equity-lo)/sp*110).toFixed(1)).join(' ')+'"/>'} else $('curve').innerHTML='';
 tbl('trades',['Time','Coin','Buy','Sell','Size $','Net $','Net %','Pred P'],t.map(r=>`<tr><td>${r.ts.slice(11,19)}</td><td class="l">${r.symbol}</td><td class="l">${r.buy_ex}</td><td class="l">${r.sell_ex}</td><td>${f(r.notional_usd,0)}</td><td class="${cls(r.net_usd)}">${f(r.net_usd)}</td><td class="${cls(r.net_pct)}">${f(r.net_pct)}</td><td>${f(r.predicted_p,2)}</td></tr>`));
 tbl('obs',['Time','Coin','Buy','Sell','Gross %','Net %','Size $','2 scans?'],o.latest.map(r=>`<tr><td>${r.ts.slice(11,19)}</td><td class="l">${r.symbol}</td><td class="l">${r.buy_ex}</td><td class="l">${r.sell_ex}</td><td>${f(r.gross_pct)}</td><td class="${cls(r.net_pct)}">${f(r.net_pct)}</td><td>${f(r.notional_usd,0)}</td><td>${r.persisted?'yes':''}</td></tr>`));
 tbl('routes',['Coin','Buy','Sell','Seen','Avg net %','Best net %','% profitable'],o.routes.map(r=>`<tr><td class="l">${r.symbol}</td><td class="l">${r.buy_ex}</td><td class="l">${r.sell_ex}</td><td>${r.n}</td><td class="${cls(r.avg_net_pct)}">${f(r.avg_net_pct)}</td><td>${f(r.best_net_pct)}</td><td>${r.profitable_pct}</td></tr>`));
 const st=p.stats; $('pstats').textContent=`${st.total} predictions, ${st.resolved} scored, hit rate ${st.hitRate==null?'-':(st.hitRate*100).toFixed(1)+'%'}, Brier ${st.brier==null?'-':st.brier} - ${st.note}`;
 tbl('calib',['Predicted P','Count','Avg predicted','Actual hit rate'],st.calibration.map(b=>`<tr><td class="l">${b.range}</td><td>${b.n}</td><td>${b.avgPredicted}</td><td>${b.hitRate}</td></tr>`));
 tbl('preds',['Route','P','Result','Reasoning'],p.recent.slice(0,12).map(r=>`<tr><td class="l">${r.key}</td><td>${f(r.probability,2)}</td><td>${r.resolved_at?(r.outcome?'<span class="pos">held</span>':'<span class="neg">gone</span>'):'open'}</td><td class="l muted" style="white-space:normal">${(r.reasoning||'').slice(0,90)}</td></tr>`));
 tbl('hist',['Coin','Bars','Venues','Median gap %','90th pct %','Max gap %','Bars above cost','Cost %'],s.history.map(r=>`<tr><td class="l">${r.symbol}</td><td>${r.bars}</td><td>${r.exchanges}</td><td>${f(r.p50)}</td><td>${f(r.p90)}</td><td>${f(r.max_spread)}</td><td>${(r.share_above_cost*100).toFixed(1)}%</td><td>${f(r.cost_pct,2)}</td></tr>`));
}
load().catch(e=>$('upd').textContent='error: '+e.message); setInterval(()=>load().catch(()=>{}),15000);
</script></body></html>
